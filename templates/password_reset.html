{% extends "base.html" %}
{% load static %}

{% block title %}Reset your password — Atlas Intelligence Platform{% endblock %}

{% block content %}
<section class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
  <div class="glass-card p-4 p-md-5" style="max-width: 420px; width: 100%;">

    <div class="text-center mb-4">
      <span class="df-logo-mark d-inline-flex align-items-center gap-1">
        <span class="bracket">&lt;</span>Atlas<span class="bracket">/&gt;</span>
      </span>
      <h1 class="h4 display-font mt-3 mb-1">Reset your password</h1>
      <p class="text-secondary small mb-0">We'll email you a link to set a new one.</p>
    </div>

    <form method="post" action="#" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_email" class="form-label small text-secondary mb-1">Work email</label>
        <input
          type="email" name="email" id="id_email" class="form-control" required autofocus
          style="background: var(--bg-surface); border: 1px solid var(--border-glass-strong); color: var(--text-primary); border-radius: 10px; padding: 0.65rem 0.9rem;">
      </div>
      <button type="submit" class="btn btn-df-primary w-100">Send reset link</button>
    </form>

    <p class="text-center text-secondary small mt-4 mb-0">
      Remembered it?
      <a href="{% url 'login' %}" class="mono" style="color: var(--accent-teal);">Back to sign in</a>
    </p>
  </div>
</section>
{% endblock %}
